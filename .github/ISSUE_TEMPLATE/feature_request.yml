name: Feature request
description: Suggest a new platform, backup target, workflow or CLI improvement
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that Proctor does not support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the command, flags or workflow you would like.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform(s)
      description: Distribution/BSD and init system this matters for
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md).
          required: true
